<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HK Nitra – FANSELFIE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#photo-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 142px;
    background: #000;
    overflow: hidden;
}

.fan-photo {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 0;

    transition: opacity 0.5s ease;

    background: #000;
}

.fan-photo.active {
    opacity: 1;
}

#template {
    position: absolute;
    bottom: 0;
    left: 0;

    width: 100%;
    height: auto;

    z-index: 20;

    pointer-events: none;
}

#status {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-family: Arial, sans-serif;
    font-size: 32px;
    letter-spacing: 2px;

    z-index: 1;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <div id="photo-area">

        <div id="status">
            NAČÍTAVAM FANSELFIE...
        </div>

        <img id="photoA" class="fan-photo" alt="">
        <img id="photoB" class="fan-photo" alt="">

    </div>

    <img
        id="template"
        src="template.png"
        alt="FANSELFIE"
    >

</div>


<script>

/* =========================================
   FANSELFIE API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzVg2xzqCyZo1gZoB8XTHEDTIM5DFzCwKcKYRWj4c6FShfXLsr_d93JTgn6KiAQAVH-Uw/exec";


/* Fotka zostane 5 sekúnd */
const SLIDE_TIME = 5000;

/* Nové fotky kontrolujeme každé 3 sekundy */
const REFRESH_TIME = 3000;

/* Prechod */
const FADE_TIME = 500;


let photos = [];

let currentIndex = 0;

let activeLayer = "A";

let initialized = false;

let isChanging = false;

let slideTimer = null;

let newestKnownPhoto = null;

let pendingNewestPhoto = null;


const photoA =
    document.getElementById("photoA");

const photoB =
    document.getElementById("photoB");

const status =
    document.getElementById("status");


/* =========================================
   ZOBRAZENIE FOTKY
========================================= */

function showPhoto(url) {

    return new Promise((resolve) => {

        if (!url) {
            resolve();
            return;
        }

        const current =
            activeLayer === "A"
                ? photoA
                : photoB;

        const next =
            activeLayer === "A"
                ? photoB
                : photoA;


        isChanging = true;

        next.classList.remove("active");
        next.style.zIndex = "1";


        next.onload = function () {

            status.classList.add("hidden");

            next.style.zIndex = "3";
            current.style.zIndex = "2";


            requestAnimationFrame(() => {

                next.classList.add("active");


                setTimeout(() => {

                    current.classList.remove("active");
                    current.style.zIndex = "1";

                    activeLayer =
                        activeLayer === "A"
                            ? "B"
                            : "A";

                    isChanging = false;

                    resolve();

                }, FADE_TIME);

            });

        };


        next.onerror = function () {

            console.log(
                "Fotku sa nepodarilo načítať:",
                url
            );

            isChanging = false;

            resolve();
        };


        /*
        Stará fotografia zostáva zobrazená,
        kým sa nová reálne nenačíta.
        */

        next.src = url;

    });

}


/* =========================================
   ĎALŠIA FOTKA
========================================= */

async function playNext() {

    if (isChanging) {
        scheduleNext();
        return;
    }


    /*
    Ak počas zobrazovania pribudla nová fotka,
    má prioritu a pôjde TERAZ.
    */

    if (pendingNewestPhoto) {

        const url = pendingNewestPhoto;

        pendingNewestPhoto = null;

        await showPhoto(url);

        scheduleNext();

        return;
    }


    if (!photos.length) {

        scheduleNext();

        return;
    }


    if (currentIndex >= photos.length) {
        currentIndex = 0;
    }


    const url = photos[currentIndex];

    currentIndex++;


    await showPhoto(url);

    scheduleNext();
}


/* =========================================
   ČASOVAČ
========================================= */

function scheduleNext() {

    clearTimeout(slideTimer);

    slideTimer =
        setTimeout(
            playNext,
            SLIDE_TIME
        );
}


/* =========================================
   NAČÍTANIE AKTUÁLNYCH FOTIEK
========================================= */

async function loadPhotos() {

    try {

        const separator =
            API_URL.includes("?") ? "&" : "?";

        const response =
            await fetch(
                API_URL +
                separator +
                "t=" +
                Date.now(),
                {
                    cache: "no-store",
                    redirect: "follow"
                }
            );


        if (!response.ok) {
            throw new Error("API error");
        }


        const data =
            await response.json();


        const freshPhotos =
            Array.isArray(data.photos)
                ? data.photos.filter(
                    url =>
                        typeof url === "string" &&
                        url.startsWith("http")
                )
                : [];


        if (!freshPhotos.length) {

            if (!initialized) {

                status.textContent =
                    "ZATIAĽ ŽIADNE FANSELFIE";

            }

            return;
        }


        /* =====================================
           PRVÉ OTVORENIE
        ===================================== */

        if (!initialized) {

            photos = freshPhotos;

            newestKnownPhoto =
                freshPhotos[0];

            initialized = true;

            /*
            Apps Script už posiela:
            najnovšia → najstaršia
            */

            currentIndex = 1;


            await showPhoto(
                photos[0]
            );


            scheduleNext();

            return;
        }


        /* =====================================
           KONTROLA NOVEJ FOTKY
        ===================================== */

        const newNewest =
            freshPhotos[0];


        if (
            newNewest &&
            newNewest !== newestKnownPhoto
        ) {

            /*
            Zapamätáme si ju.

            Aktuálnu fotku NEPRERUŠÍME.
            Nová pôjde ako nasledujúca.
            */

            pendingNewestPhoto =
                newNewest;

            newestKnownPhoto =
                newNewest;
        }


        /*
        Aktualizujeme celý zoznam.
        */

        photos = freshPhotos;


    } catch (error) {

        console.error(
            "FANSELFIE API chyba:",
            error
        );


        /*
        Ak API na chvíľu vypadne,
        už načítaný slider pokračuje.
        */

        if (!initialized) {

            status.textContent =
                "ČAKÁM NA FOTKY...";

        }

    }

}


/* =========================================
   AUTOMATICKÁ KONTROLA
========================================= */

setInterval(
    loadPhotos,
    REFRESH_TIME
);


/* =========================================
   ŠTART
========================================= */

loadPhotos();

</script>

</body>
</html>
