<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HK Nitra – FANSELFIE</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#photo-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 142px;
    background: #000;
    overflow: hidden;
}

.fan-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.fan-photo.active {
    opacity: 1;
}

#template {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    z-index: 20;
    pointer-events: none;
}

#status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    z-index: 1;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <div id="photo-area">
        <div id="status">NAČÍTAVAM FANSELFIE...</div>

        <img id="photoA" class="fan-photo" alt="">
        <img id="photoB" class="fan-photo" alt="">
    </div>

    <img id="template" src="template.png" alt="FANSELFIE">

</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTAOV5g4WpKAF_C5NPsrGnOlcSz66F92fI0PKY6DjgZkF6APObWtHkuW6MJivb7f8dqnVD1x09_JwI2/pub?gid=0&single=true&output=csv";

const SLIDE_TIME = 5000;
const REFRESH_TIME = 5000;

let photos = [];
let currentIndex = 0;
let activeLayer = "A";
let changing = false;
let initialized = false;

const photoA = document.getElementById("photoA");
const photoB = document.getElementById("photoB");
const status = document.getElementById("status");


function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {

        const c = text[i];

        if (c === '"') {

            if (quoted && text[i + 1] === '"') {
                value += '"';
                i++;
            } else {
                quoted = !quoted;
            }

        } else if (c === "," && !quoted) {

            row.push(value);
            value = "";

        } else if ((c === "\n" || c === "\r") && !quoted) {

            if (c === "\r" && text[i + 1] === "\n") i++;

            row.push(value);

            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }

            row = [];
            value = "";

        } else {

            value += c;
        }
    }

    if (value || row.length) {
        row.push(value);
        rows.push(row);
    }

    return rows;
}


function displayPhoto(url) {

    if (!url || changing) return;

    changing = true;

    const current =
        activeLayer === "A" ? photoA : photoB;

    const next =
        activeLayer === "A" ? photoB : photoA;

    /*
    Novú fotku načítame do neviditeľnej vrstvy.
    Aktuálna zostáva celý čas na obrazovke.
    */

    next.classList.remove("active");

    next.onload = function () {

        status.classList.add("hidden");

        next.style.zIndex = "3";
        current.style.zIndex = "2";

        /*
        Až TERAZ, keď je nová fotka načítaná,
        ju zobrazíme.
        */

        requestAnimationFrame(() => {

            next.classList.add("active");

            setTimeout(() => {

                current.classList.remove("active");
                current.style.zIndex = "1";

                activeLayer =
                    activeLayer === "A" ? "B" : "A";

                changing = false;

            }, 550);

        });
    };


    next.onerror = function () {

        console.log("Nepodarilo sa načítať:", url);

        changing = false;

        /*
        Ak jedna fotka nefunguje,
        slider nezostane zaseknutý.
        */
        setTimeout(nextPhoto, 500);
    };


    /*
    Toto spustí samotné načítanie.
    */
    next.src = url;
}


function nextPhoto() {

    if (!photos.length || changing) return;

    if (currentIndex >= photos.length) {
        currentIndex = 0;
    }

    const url = photos[currentIndex];

    currentIndex++;

    displayPhoto(url);
}


async function loadPhotos() {

    try {

        const response = await fetch(
            CSV_URL + "&t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("CSV error");
        }

        const text = await response.text();

        const rows = parseCSV(text);

        const newPhotos = rows
            .slice(1)
            .map(row => row[3] ? row[3].trim() : "")
            .filter(url => url.startsWith("http"))
            .reverse();


        if (!newPhotos.length) {

            photos = [];

            if (!initialized) {
                status.textContent =
                    "ZATIAĽ ŽIADNE FANSELFIE";
            }

            return;
        }


        /*
        PRVÉ SPUSTENIE
        */

        if (!initialized) {

            photos = newPhotos;

            initialized = true;

            currentIndex = 1;

            displayPhoto(photos[0]);

            return;
        }


        /*
        NOVÁ FOTKA POČAS ZÁPASU
        */

        const oldNewest = photos[0];

        photos = newPhotos;

        if (photos[0] !== oldNewest) {

            /*
            Nová fotka dostane prioritu.
            */

            currentIndex = 1;

            if (!changing) {
                displayPhoto(photos[0]);
            }
        }


    } catch (error) {

        console.error(error);

        /*
        Ak Google Sheet na chvíľu neodpovie,
        slider pokračuje s fotkami,
        ktoré už má načítané.
        */

        if (!initialized) {

            status.textContent =
                "ČAKÁM NA FOTKY...";
        }
    }
}


/* Každých 5 sekúnd ďalšia fotka */
setInterval(nextPhoto, SLIDE_TIME);


/* Každých 5 sekúnd kontrola nových */
setInterval(loadPhotos, REFRESH_TIME);


/* Štart */
loadPhotos();

</script>

</body>
</html>
