<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HK Nitra – FANSELFIE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

/* Priestor pre fotografie */
#photo-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 142px;
    background: #000;
    overflow: hidden;
}

/* Dve vrstvy fotografií */
.fan-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.6s ease;
}

.fan-photo.active {
    opacity: 1;
}

/* FANSELFIE spodná grafika */
#template {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    z-index: 20;
    pointer-events: none;
}

#status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    z-index: 1;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <div id="photo-area">
        <div id="status">NAČÍTAVAM FANSELFIE...</div>

        <img id="photoA" class="fan-photo" alt="">
        <img id="photoB" class="fan-photo" alt="">
    </div>

    <img id="template" src="template.png" alt="FANSELFIE">

</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTAOV5g4WpKAF_C5NPsrGnOlcSz66F92fI0PKY6DjgZkF6APObWtHkuW6MJivb7f8dqnVD1x09_JwI2/pub?gid=0&single=true&output=csv";

/* čas jednej fotky */
const SLIDE_TIME = 5000;

/* kontrola nových fotiek */
const REFRESH_TIME = 10000;

/* fade prechod */
const FADE_TIME = 600;

let photos = [];
let currentIndex = 0;
let activeLayer = "A";
let changing = false;
let initialized = false;

const photoA = document.getElementById("photoA");
const photoB = document.getElementById("photoB");
const statusElement = document.getElementById("status");


function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        if (char === '"') {

            if (insideQuotes && text[i + 1] === '"') {
                value += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }

        } else if (char === "," && !insideQuotes) {

            row.push(value);
            value = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && text[i + 1] === "\n") {
                i++;
            }

            row.push(value);

            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }

            row = [];
            value = "";

        } else {

            value += char;

        }
    }

    if (value || row.length) {
        row.push(value);
        rows.push(row);
    }

    return rows;
}


/* Načíta aktuálny zoznam zo Sheets */
async function loadPhotos() {

    try {

        const response = await fetch(
            CSV_URL + "&cache=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("CSV sa nepodarilo načítať");
        }

        const text = await response.text();
        const rows = parseCSV(text);

        const newPhotos = rows
            .slice(1)
            .map(row => row[3] ? row[3].trim() : "")
            .filter(url => url.startsWith("http"))
            .reverse();

        if (!newPhotos.length) {

            photos = [];
            statusElement.textContent = "ZATIAĽ ŽIADNE FANSELFIE";
            statusElement.classList.remove("hidden");
            return;
        }

        const previousNewest = photos.length ? photos[0] : null;

        photos = newPhotos;

        /* Pri prvom otvorení vždy začni najnovšou */
        if (!initialized) {

            initialized = true;
            currentIndex = 0;

            await showPhoto(photos[0]);

            currentIndex = 1;
            return;
        }

        /*
        Ak počas premietania pribudla nová fotka,
        zobraz ju ako ďalšiu.
        */
        if (previousNewest && photos[0] !== previousNewest) {

            currentIndex = 0;

            await showPhoto(photos[0]);

            currentIndex = 1;
        }

    } catch (error) {

        console.error(error);

        /*
        Ak už fotografia beží, pri dočasnej chybe
        ju necháme na obrazovke.
        */
        if (!initialized) {
            statusElement.textContent =
                "FOTKY SA NEPODARILO NAČÍTAŤ";
            statusElement.classList.remove("hidden");
        }
    }
}


/* Bezpečne načíta obrázok ešte pred zobrazením */
function preloadImage(url) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(url);
        img.onerror = reject;
        img.src = url;
    });
}


/* Plynulé prepnutie bez čiernej obrazovky */
async function showPhoto(url) {

    if (!url || changing) return;

    changing = true;

    try {

        /*
        Najskôr sa obrázok kompletne stiahne.
        Stará fotografia zatiaľ zostáva viditeľná.
        */
        await preloadImage(url);

        const current =
            activeLayer === "A" ? photoA : photoB;

        const next =
            activeLayer === "A" ? photoB : photoA;

        next.src = url;

        /*
        Počkáme, kým browser obrázok naozaj
        pripraví na vykreslenie.
        */
        if (next.decode) {
            try {
                await next.decode();
            } catch (e) {}
        }

        statusElement.classList.add("hidden");

        /* nová fotografia nad starou */
        next.style.zIndex = "3";
        current.style.zIndex = "2";

        next.classList.add("active");

        /*
        Starú schováme až po fade.
        Počas celého prechodu je teda vždy
        minimálne jedna fotografia viditeľná.
        */
        setTimeout(() => {

            current.classList.remove("active");
            current.style.zIndex = "1";

        }, FADE_TIME);

        activeLayer =
            activeLayer === "A" ? "B" : "A";

    } catch (error) {

        console.error("Fotka sa nepodarila načítať:", url);

    } finally {

        changing = false;
    }
}


/* Ďalšia fotografia */
async function nextPhoto() {

    if (!photos.length || changing) return;

    if (currentIndex >= photos.length) {
        currentIndex = 0;
    }

    const url = photos[currentIndex];

    currentIndex++;

    await showPhoto(url);
}


/* Slider */
setInterval(nextPhoto, SLIDE_TIME);


/* Priebežne kontroluj nové Tally fotky */
setInterval(loadPhotos, REFRESH_TIME);


/* Prvé načítanie */
loadPhotos();

</script>

</body>
</html>
