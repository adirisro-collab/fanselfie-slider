<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HK Nitra – FANSELFIE</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}


/* CELÁ OBRAZOVKA */

#screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}


/* PRIESTOR PRE FOTKU */

#photo-area {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    /* priestor pre spodnú FANSELFIE grafiku */
    bottom: 142px;

    background: #000;
    overflow: hidden;
}


/* FOTKY */

.fan-photo {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    /*
    Fotku NEOREŽE.
    Celá fotografia zostane viditeľná.
    */
    object-fit: contain;

    opacity: 0;

    transition:
        opacity 0.5s ease;

    background: #000;
}


.fan-photo.active {
    opacity: 1;
}


/* SPODNÁ FANSELFIE ŠABLÓNA */

#template {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: auto;

    z-index: 20;

    pointer-events: none;
}


/* TEXT PRI PRVOM NAČÍTANÍ */

#status {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #fff;

    font-family: Arial, sans-serif;

    font-size: 32px;

    letter-spacing: 2px;

    z-index: 1;
}


.hidden {
    display: none !important;
}

</style>
</head>


<body>


<div id="screen">


    <div id="photo-area">


        <div id="status">
            NAČÍTAVAM FANSELFIE...
        </div>


        <!--
        Používame dve vrstvy.
        Kým sa nová fotka načítava,
        stará zostáva na obrazovke.
        -->

        <img
            id="photoA"
            class="fan-photo"
            alt=""
        >

        <img
            id="photoB"
            class="fan-photo"
            alt=""
        >


    </div>


    <!--
    Tvoja FANSELFIE grafika.
    Súbor musí byť v GitHube ako template.png
    -->

    <img
        id="template"
        src="template.png"
        alt="FANSELFIE"
    >


</div>



<script>


/* =========================================
   NASTAVENIA
========================================= */


const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTAOV5g4WpKAF_C5NPsrGnOlcSz66F92fI0PKY6DjgZkF6APObWtHkuW6MJivb7f8dqnVD1x09_JwI2/pub?gid=0&single=true&output=csv";


/*
Ako dlho je fotografia na obrazovke.
5000 = 5 sekúnd.
*/

const SLIDE_TIME = 5000;


/*
Ako často kontrolujeme,
či v Google Sheets pribudli nové fotky.
*/

const REFRESH_TIME = 5000;


/*
Dĺžka plynulého prechodu.
*/

const FADE_TIME = 500;



/* =========================================
   PREMENNÉ
========================================= */


let photos = [];

let currentIndex = 0;

let activeLayer = "A";

let initialized = false;

let slideTimer = null;

let isChanging = false;


const photoA =
    document.getElementById("photoA");

const photoB =
    document.getElementById("photoB");

const status =
    document.getElementById("status");



/* =========================================
   ČÍTANIE CSV
========================================= */


function parseCSV(text) {


    const rows = [];

    let row = [];

    let value = "";

    let quoted = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        const c = text[i];


        if (c === '"') {


            if (
                quoted &&
                text[i + 1] === '"'
            ) {

                value += '"';

                i++;

            } else {

                quoted = !quoted;

            }


        }


        else if (
            c === "," &&
            !quoted
        ) {


            row.push(value);

            value = "";


        }


        else if (
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !quoted
        ) {


            if (
                c === "\r" &&
                text[i + 1] === "\n"
            ) {

                i++;

            }


            row.push(value);


            if (
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            value = "";


        }


        else {


            value += c;


        }

    }


    if (
        value ||
        row.length
    ) {


        row.push(value);

        rows.push(row);


    }


    return rows;

}



/* =========================================
   ZOBRAZENIE FOTKY
========================================= */


function showPhoto(url) {


    return new Promise(
        (resolve) => {


            if (!url) {

                resolve();

                return;

            }


            if (isChanging) {

                resolve();

                return;

            }


            isChanging = true;



            /*
            Zistíme, ktorá vrstva je teraz
            viditeľná a ktorá je voľná.
            */


            const current =
                activeLayer === "A"
                    ? photoA
                    : photoB;


            const next =
                activeLayer === "A"
                    ? photoB
                    : photoA;



            /*
            Pripravíme neviditeľnú vrstvu.
            */


            next.classList.remove(
                "active"
            );


            next.style.zIndex = "1";



            /*
            Toto sa spustí AŽ KEĎ
            je nová fotografia načítaná.
            */


            next.onload = function () {


                status.classList.add(
                    "hidden"
                );


                /*
                Novú fotku dáme nad starú.
                */


                next.style.zIndex = "3";

                current.style.zIndex = "2";



                requestAnimationFrame(
                    () => {


                        /*
                        Plynulo zobraz novú.
                        */


                        next.classList.add(
                            "active"
                        );



                        setTimeout(
                            () => {


                                /*
                                Až po prechode
                                skryjeme starú.
                                */


                                current
                                    .classList
                                    .remove(
                                        "active"
                                    );


                                current.style.zIndex =
                                    "1";


                                /*
                                Nová vrstva je teraz
                                aktívna.
                                */


                                activeLayer =
                                    activeLayer === "A"
                                        ? "B"
                                        : "A";


                                isChanging = false;


                                resolve();


                            },
                            FADE_TIME
                        );


                    }
                );


            };



            /*
            Ak je URL fotografie chybná,
            slider sa nezasekne.
            */


            next.onerror = function () {


                console.log(
                    "Preskakujem fotografiu:",
                    url
                );


                isChanging = false;


                resolve();


            };



            /*
            Spustenie načítania fotografie.
            */


            next.src = url;


        }
    );

}



/* =========================================
   ĎALŠIA FOTKA
========================================= */


async function playNext() {


    if (!photos.length) {


        scheduleNext();

        return;


    }


    if (isChanging) {


        scheduleNext();

        return;


    }


    /*
    Ak sme na konci zoznamu,
    začneme znova od najnovšej.
    */


    if (
        currentIndex >=
        photos.length
    ) {


        currentIndex = 0;


    }


    const url =
        photos[currentIndex];


    currentIndex++;


    await showPhoto(url);


    scheduleNext();

}



/* =========================================
   ČASOVAČ SLIDERA
========================================= */


function scheduleNext() {


    clearTimeout(
        slideTimer
    );


    slideTimer =
        setTimeout(
            playNext,
            SLIDE_TIME
        );

}



/* =========================================
   NAČÍTANIE GOOGLE SHEET
========================================= */


async function loadPhotos() {


    try {


        /*
        Timestamp zabráni browseru,
        aby používal starú cache CSV.
        */


        const separator =
            CSV_URL.includes("?")
                ? "&"
                : "?";


        const response =
            await fetch(

                CSV_URL +
                separator +
                "t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );



        if (!response.ok) {


            throw new Error(
                "Google Sheet sa nepodarilo načítať."
            );


        }



        const text =
            await response.text();


        const rows =
            parseCSV(text);



        /*
        Stĺpec D = index 3.

        Prvý riadok je hlavička,
        preto používame slice(1).
        */


        const freshPhotos =
            rows

                .slice(1)

                .map(
                    row =>
                        row[3]
                            ? row[3].trim()
                            : ""
                )

                .filter(
                    url =>
                        url.startsWith(
                            "http"
                        )
                )

                /*
                Tally pridáva nové riadky dole.

                Reverse znamená:
                NAJNOVŠIA FOTKA JE PRVÁ.
                */

                .reverse();



        /*
        Žiadne fotografie.
        */


        if (
            !freshPhotos.length
        ) {


            photos = [];


            if (!initialized) {


                status.textContent =
                    "ZATIAĽ ŽIADNE FANSELFIE";


            }


            return;

        }



        /*
        PRVÉ OTVORENIE SLIDERA
        */


        if (!initialized) {


            photos =
                freshPhotos;


            initialized =
                true;


            /*
            Najnovšiu zobrazíme
            okamžite.
            */


            currentIndex = 1;


            await showPhoto(
                photos[0]
            );


            /*
            A spustíme ďalšie.
            */


            scheduleNext();


            return;

        }



        /*
        PRI ĎALŠÍCH KONTROLÁCH
        iba aktualizujeme zoznam.

        NERUŠÍME fotografiu,
        ktorá sa práve zobrazuje.
        */


        photos =
            freshPhotos;



    }


    catch (error) {


        console.error(
            "Chyba pri načítaní:",
            error
        );


        /*
        Ak už máme fotky,
        slider pokračuje ďalej.

        Výpadok Google Sheets
        ho teda nezastaví.
        */


        if (!initialized) {


            status.textContent =
                "ČAKÁM NA FOTKY...";


        }


    }

}



/* =========================================
   AUTOMATICKÁ KONTROLA NOVÝCH FOTIEK
========================================= */


setInterval(
    loadPhotos,
    REFRESH_TIME
);



/* =========================================
   ŠTART
========================================= */


loadPhotos();


</script>


</body>
</html>
